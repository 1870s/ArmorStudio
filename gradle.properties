org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false

# Minecraft version to build for. Override with -Pmc_version=26.3 etc.
# Every supported version has a matching file in versions/<mc_version>.properties.
mc_version=26.1.2

# Build tooling (shared by every Minecraft version)
loom_version=1.19.3
moddevgradle_version=2.0.148

mod_id=armorstudio
mod_name=Armor Studio
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.armorstudio
