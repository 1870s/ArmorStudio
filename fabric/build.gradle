plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
    archivesName = "${mod_id}-fabric"
}

sourceSets.main {
    java.srcDirs(commonJavaDirs)
    resources.srcDirs(commonResourceDirs)
}

loom {
    runs {
        client {
            runDir = "../run/${minecraft_version}/fabric"
        }
        // Automated in-game check: creates a test world, exercises every visibility mode and takes screenshots.
        selfTest {
            client()
            runDir = "../run/${minecraft_version}/fabric-selftest"
            property('armorstudio.selftest', 'true')
        }
    }
}

dependencies {
    // Minecraft 26.x is unobfuscated: no mappings, no remapping.
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

processResources {
    def props = [
        version               : version,
        fabric_loader_version : fabric_loader_version,
        fabric_minecraft_range: fabric_minecraft_range,
    ]
    inputs.properties props
    filesMatching('fabric.mod.json') {
        expand props
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

// The self test is for development only and is not shipped.
tasks.named('jar', Jar) {
    exclude 'com/armorstudio/dev/**'
}
