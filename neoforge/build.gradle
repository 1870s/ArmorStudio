plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version "${moddevgradle_version}"
}

base {
    archivesName = "${mod_id}-neoforge"
}

// Minecraft 26.x runs on Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main {
    java.srcDirs(commonJavaDirs)
    resources.srcDirs(commonResourceDirs)
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            gameDirectory = rootProject.file("run/${minecraft_version}/neoforge")
        }
        // Automated in-game check: creates a test world, exercises every visibility mode and takes screenshots.
        selfTest {
            client()
            gameDirectory = rootProject.file("run/${minecraft_version}/neoforge-selftest")
            systemProperty 'armorstudio.selftest', 'true'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Expands ${...} placeholders in src/main/templates (neoforge.mods.toml).
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
        mod_id                  : mod_id,
        mod_name                : mod_name,
        mod_license             : mod_license,
        mod_version             : version,
        neo_version_range       : neo_version_range,
        neoforge_minecraft_range: neoforge_minecraft_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// The self test is for development only and is not shipped.
tasks.named('jar', Jar) {
    exclude 'com/armorstudio/dev/**'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
